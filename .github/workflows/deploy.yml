# Buduje stronę i wgrywa folder `out` na hosting SEOHOST po każdym pushu do main.
# Sekrety ustawiasz w GitHub: Settings → Secrets and variables → Actions:
#   FTP_SERVER      – adres serwera FTP z panelu SEOHOST
#   FTP_USERNAME    – login konta FTP
#   FTP_PASSWORD    – hasło konta FTP
#   FTP_SERVER_DIR  – folder strony na serwerze, zakończony "/", np. /domains/dssdesign.pl/public_html/
#   WEB3FORMS_KEY   – klucz Web3Forms (ten sam co NEXT_PUBLIC_WEB3FORMS_KEY w .env.local)

name: Wdrożenie na hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}

      - name: Wgraj na SEOHOST
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
